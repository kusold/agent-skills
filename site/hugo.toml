baseURL = 'https://kusold-agent-skills.pages.dev/'
title = 'Agent Skills'
theme = 'hugo-book'
enableGitInfo = true
disableKinds = ['taxonomy', 'term']

# HTML only — no RSS feeds for a docs site (the sitemap is still generated).
[outputs]
  home = ['html']
  page = ['html']
  section = ['html']

# Cache processed images outside the output tree; pairs with HUGO_CACHEDIR
# exported by build.sh
# (https://gohugo.io/host-and-deploy/deploy-to-cloudflare/).
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# The site renders the repo as-is: ../docs and ../skills are mounted as
# content instead of being copied or symlinked into a content/ directory.
# NOTE: defining mounts discards Hugo's defaults, so 'content' must be
# redeclared explicitly.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = '../docs'
    target = 'content/docs'
  [[module.mounts]]
    source = '../skills'
    target = 'content/skills'
  # Publish the bundled wiki-lint scripts so docs can link to the raw files.
  [[module.mounts]]
    source = '../skills/wiki-lint/scripts'
    target = 'static/skills/wiki-lint/scripts'

[markup.goldmark.renderer]
  # Needed by the theme's shortcodes (mermaid, katex, tabs).
  unsafe = true

[params]
  # Sidebar is built from the /docs section.
  BookSection = 'docs'
  BookTheme = 'auto'
  BookSearch = true
  # Resolve editor-style relative links (e.g. ../../skills/x/SKILL.md)
  # between pages and warn at build time when a target is missing.
  BookPortableLinks = 'warning'
  BookRepo = 'https://github.com/kusold/agent-skills'
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/kusold/agent-skills'
  weight = 10
